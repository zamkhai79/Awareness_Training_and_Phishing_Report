{% extends 'base.html' %}{% block heading %}Review PH-{{'%04d'|format(item.id)}}{% endblock %}{% block content %}<div class="two"><section class="panel"><span class="eyebrow">REPORTED MESSAGE</span><h3>{{item.subject}}</h3><p><b>From:</b> {{item.sender}}</p><p><b>Reported by:</b> {{item.username}}</p><p><b>Reason:</b> {{item.reason}}</p><p><b>Created:</b> {{item.created_at|est}}</p></section><section class="panel"><h3>Analyst decision</h3><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Classification<select name="status"><option value="pending" {% if item.status=='pending' %}selected{% endif %}>Pending</option><option value="phishing" {% if item.status=='phishing' %}selected{% endif %}>Confirmed phishing</option><option value="legitimate" {% if item.status=='legitimate' %}selected{% endif %}>Legitimate</option><option value="needs_more_info" {% if item.status=='needs_more_info' %}selected{% endif %}>Needs more information</option></select></label><label>Investigation notes<textarea name="note" maxlength="1500" rows="5" placeholder="Explain evidence and next steps">{{item.analyst_note}}</textarea></label><button class="btn" type="submit">Save classification →</button></form></section></div>{% endblock %}
